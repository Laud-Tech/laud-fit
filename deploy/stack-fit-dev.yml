version: "3.7"

# Laud Fit — test stack for Portainer, at https://fit-dev.laud.tec.br
#
# Runs next to the current openGym stack (gym.laud.tec.br) without touching it: other service
# names, other Traefik router, other data folder. Nothing here reads /data/opengym.
#
# Images are private on GHCR. In Portainer add a registry first (Registries -> Add registry ->
# Custom registry, URL ghcr.io, username = your GitHub user, password = a personal access token
# with read:packages), then deploy this stack. To update: re-deploy with "Re-pull image".
#
# First start: the instance is empty, so INVITE_ONLY=0 and FIRST_USER_ADMIN=1 let you create your
# own profile, which becomes the admin. Do that straight away, then set INVITE_ONLY=1 and
# re-deploy (with INVITE_ONLY=1 and no profile yet nobody could generate the first invite code).
# The data folder must exist on the host:  mkdir -p /data/laudfit-dev/data

services:

  laudfit-api:
    image: ghcr.io/laud-tech/laud-fit/api:edge

    environment:
      - PORT=3000
      - DATA_DIR=/data

      # Passkeys / WebAuthn. RP_ID is the exact hostname; passkeys made here do not work on
      # gym.laud.tec.br and the other way round.
      - RP_ID=fit-dev.laud.tec.br
      - ORIGIN=https://fit-dev.laud.tec.br
      - RP_NAME=Laud Fit

      # Session length in days
      - SESSION_DAYS=90

      # Access control. 0 = anyone can create a profile, 1 = invite code required.
      - INVITE_ONLY=0
      - FIRST_USER_ADMIN=1
      - ALLOW_GUEST=0

      # Password sign-in next to passkeys, for recovery and for browsers without passkeys.
      # Nobody has a password until they set one in Settings.
      - PASSWORD_LOGIN=1

      # The API is only reachable through the web container, which overwrites X-Forwarded-For.
      - TRUST_PROXY=1

      # Default language for the sign-in screen and for profiles that never picked one
      - DEFAULT_LANG=pt-BR

      # Activity log
      - AUDIT_LOG=1
      - AUDIT_MAX=5000
      - AUDIT_DAYS=90
      - AUDIT_IP=off

      - TZ=America/Cuiaba

    volumes:
      - /data/laudfit-dev/data:/data

    networks:
      - laud_network

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      resources:
        limits:
          cpus: "1"
          memory: 512M

    restart: unless-stopped


  laudfit-web:
    image: ghcr.io/laud-tech/laud-fit/web:edge

    # Exercise pictures and clips are part of this image: no media volumes.
    environment:
      - BACKEND=laudfit-api
      - PORT=3000
      - NGINX_PORT=80

    networks:
      - laud_network

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      resources:
        limits:
          cpus: "1"
          memory: 256M

      labels:

        # Traefik
        - traefik.enable=true

        # Router
        - traefik.http.routers.laudfit-dev.rule=Host(`fit-dev.laud.tec.br`)
        - traefik.http.routers.laudfit-dev.entrypoints=websecure
        - traefik.http.routers.laudfit-dev.tls=true
        - traefik.http.routers.laudfit-dev.tls.certresolver=letsencryptresolver

        # Service
        - traefik.http.routers.laudfit-dev.service=laudfit-dev
        - traefik.http.services.laudfit-dev.loadbalancer.server.port=80
        - traefik.http.services.laudfit-dev.loadbalancer.passHostHeader=true

    restart: unless-stopped


networks:
  laud_network:
    external: true
    name: laud_network
